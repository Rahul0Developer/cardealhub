services:
  # Web Service
  - type: web
    name: car-deal-hub
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py main:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SESSION_SECRET
        generateValue: true
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: car-deal-hub-db
          property: connectionString

databases:
  - name: car-deal-hub-db
    databaseName: cardealhub
    user: cardealhub_user
    plan: free
